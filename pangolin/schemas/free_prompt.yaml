technique: free_prompt
name: "Free Prompt"
description: "Free Prompting - Técnica flexível com exemplos e formatação configuráveis"
acronym: "FREE"
strategy: free_prompt
prompt_text: |
  {system_prompt}

  CATEGORIES:
  {categories_info}

  {examples_section}

  {context_hints}

  INPUT:
  {input_framework}

  {output_format}

system_prompt: |
  You are an expert analyst. Analyze the input and provide a classification with justification.

output_format: |
  REQUIRED OUTPUT FORMAT:
  Category: [category code or label]
  Explanation: [Detailed justification for the chosen category]

params:
  use_examples: false
  use_structured_output: true
  use_context_hints: false
  temperature_override: 0.2

categories: []

examples: []

# context_hints: loaded from schema when use_context_hints is true.
# Each entry must have 'keywords' (list of strings) and 'hint' (string).
# Example:
#   context_hints:
#     - keywords: ["error", "failed", "timeout"]
#       hint: "• This may indicate a system or connectivity failure."
context_hints: []

extraction:
  method: json
  unknown_category: UNKNOWN
