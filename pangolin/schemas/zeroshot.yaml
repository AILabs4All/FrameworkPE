technique: zeroshot
name: "Zero Shot"
description: "Zero-Shot Prompting - Técnica direta sem exemplos pré-definidos"
acronym: "ZS"
strategy: zeroshot
prompt_text: |
  {system_prompt}

  {categories_info}

  INPUT:
  {input_framework}

  {output_format}

system_prompt: |
  You are an expert analyst. Classify the input into the most appropriate category and justify your answer.

output_format: |
  REQUIRED OUTPUT FORMAT:
  Category: [category code or label]
  Explanation: [Detailed justification]

params:
  mode: zeroshot
  temperature_override: 0.0

# categories: define your domain-specific categories here.
# Example:
#   categories:
#     - code: C1
#       name: Category Name
#       description: Short description
categories: []

extraction:
  method: json
  unknown_category: UNKNOWN
