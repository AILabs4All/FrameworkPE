technique: progressive_rectification
name: "Progressive Rectification"
description: "Progressive Rectification Prompting - Valida e retifica respostas usando mascaramento"
acronym: "PRP"
strategy: progressive_rectification
prompt_text: |
  {input_framework}

  {output_format}

masking_template: |
  Replace all occurrences of the word '{subcategory}' with 'X' in the incident text.

rectification_template: |
  Incident: {input_framework}
  The answer is probably not: {rejected_category}
  Let's think step by step to reclassify.

  {output_format}

output_format: |
  If classification is not possible, return:
  Category: Unknown
  Explanation: Unknown

  OUTPUT:
  Category: [NIST code]
  Explanation: [Justification for the chosen category]
params:
  max_iter: 4
  quality_threshold: 0.9
  mode: prp
key_words:
  CAT1:
    - phishing
    - brute force
    - unauthorized access
  CAT2:
    - malware
    - ransomware
    - trojan
  CAT3:
    - ddos
    - dos
    - denial of service
  CAT4:
    - data leak
    - exposed data
    - leaked credentials
  CAT5:
    - exploit
    - vulnerability
    - cve
  CAT6:
    - insider
    - internal abuse
    - sabotage
  CAT7:
    - social engineering
    - phishing
    - vishing
  CAT8:
    - physical access
    - equipment theft
    - burglary
  CAT9:
    - modification
    - defacement
    - unauthorized change
  CAT10:
    - misuse
    - resource abuse
    - crypto mining
  CAT11:
    - third party
    - supplier
    - partner
  CAT12:
    - intrusion attempt
    - scan
    - reconnaissance
extraction:
  method: json
  unknown_category: UNKNOWN
