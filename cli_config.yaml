# SICF - Security Incident Classification Framework
# Simple CLI Configuration

framework:
  name: "Security Incident Classification Framework"
  version: "2.0.0"
  description: "Simple CLI for incident classification"

# Logging configuration
logging:
  level: "INFO"
  log_dir: "logs"
  enable_console: true
  enable_file: true

# NIST categories
nist_categories:
  enabled: true

# Model configurations
models:
  # Ollama local models
  ollama_gemma2:
    plugin: "LocalModel"
    provider: "ollama"
    model: "gemma2:9b"
    temperature: 0.2
    max_tokens: 2000
    base_url: "http://localhost:11434"
  
  ollama_mistral:
    plugin: "LocalModel"
    provider: "ollama"
    model: "mistral:7b"
    temperature: 0.2
    max_tokens: 2000
    base_url: "http://localhost:11434"
  
  ollama_deepseek:
    plugin: "LocalModel"
    provider: "ollama"
    model: "deepseek-r1:7b"
    temperature: 0.2
    max_tokens: 2000
    base_url: "http://localhost:11434"

# Prompt technique configurations
prompt_techniques:
  zeroshot:
    plugin: "ZeroShotPlugin"
    default_params:
      max_attempts: 1
  
  progressive_hint:
    plugin: "ProgressiveHintPlugin"
    default_params:
      max_hints: 4
      confidence_threshold: 0.9
  
  self_hint:
    plugin: "SelfHintPlugin"
    default_params:
      max_iterations: 3
      confidence_threshold: 0.85
  
  progressive_rectification:
    plugin: "ProgressiveRectificationPlugin"
    default_params:
      max_corrections: 3
  
  hypothesis_testing:
    plugin: "HypothesisTestingPlugin"
    default_params:
      num_hypotheses: 5
